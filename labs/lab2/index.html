<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labs!</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>my  shopping inventry</h1>
    </div>
<div class="add-item-form">
    <form id="add-item-form">
    <input type="text" id="item-name" placeholder="Enter item name">
    <input type="text" id="item-type" placeholder="Enter item type">
        <input type="number" id="price" placeholder="Enter price">
        <input type="number" id="quantity" placeholder="Enter quantity">
        <textarea id="description" placeholder="Enter description"></textarea>

        <button type="submit">Add Item</button>
        <button type="button" id="clear-form">Clear Form</button>
    </form>
</div>
    
    <div class="search-item-form">
        <form id="search-item-form">
            <input type="text" id="search-query" placeholder="Search items...">
            <button type="submit" >Search</button>
        </form>
    </div>
    <button type="button" id ="show-all-items">Show All Items</button>

    <div id="inventory-list"></div>

    <div class="remove-item-form">
        <form id="remove-item-form">
            <input type="text" id="remove-item" placeholder="Enter item name to remove">
            <button type="submit">Remove Item</button>  
        </form>
    </div>


    <div class="total-value">
        <button type="button" id="calculate-total-value">Calculate Total Inventory Value</button>
        <p id="total-value-display"></p>
    </div>

    <div class="duplicates">
        <button type="button" id="find-duplicates">Find Duplicates</button>
        <p id="duplicates-display"></p>
    </div>

</body>
</html>
