<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <main class="container mx-auto p-4">
        <h1 class="text-4xl mb-8 text-center">Meme Generator</h1>
        <div class="flex flex-col items-center gap-4">
            <input type="text" id="searchInput" class="p-2 border rounded" placeholder="Search for images...">
            <div id="imageGrid" class="grid grid-cols-3 gap-4 mb-8"></div>
            <div id="memeEditor" class="hidden bg-white p-4 rounded shadow-lg w-full max-w-md">
                <div id="memePreview" class="relative mb-4">
                    <img id="selectedImage" class="w-full" src="" alt="Selected image">
                    <input type="text" id="topText" class="w-full p-2 mb-2 border rounded" placeholder="Top text">
                    <input type="text" id="bottomText" class="w-full p-2 mb-4 border rounded" placeholder="Bottom text">
                </div>
                <button id="generateBtn" class="w-full bg-blue-500 text-white p-2 rounded">Generate Meme</button>
            </div>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
